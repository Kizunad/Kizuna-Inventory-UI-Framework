plugins {
    alias(libs.plugins.fabric.loom)
    id 'java-library'
    alias(libs.plugins.protobuf)
}

group = 'dev.kizuna.inventoryui'
version = '0.1.0-SNAPSHOT'

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.wispforest.io/releases' }
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.toVersion(libs.versions.java.get())
    targetCompatibility = JavaVersion.toVersion(libs.versions.java.get())
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = libs.versions.java.get().toInteger()
    options.encoding = 'UTF-8'
}

dependencies {
    minecraft libs.minecraft
    mappings "net.fabricmc:yarn:${libs.versions.yarn.get()}:v2"
    modImplementation libs.fabric.loader
    modImplementation libs.fabric.api
    modImplementation libs.owo
    modImplementation project(':server')
    api libs.protobuf.java
    include libs.protobuf.java
    testImplementation libs.junit.jupiter
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

sourceSets {
    // 逻辑服务器由独立 common 产物提供；客户端不再复制服务端入口。
    demo {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    wireSmoke {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

protobuf {
    // 编译器与运行库使用同一版本，避免生成代码和运行时的兼容边界漂移。
    protoc { artifact = "com.google.protobuf:protoc:${libs.versions.protobuf.java.get()}" }
    generateProtoTasks {
        ofSourceSet('main').configureEach { task ->
            task.generateDescriptorSet = true
            task.descriptorSetOptions.path = layout.buildDirectory.file('descriptors/inventory-ui-v2.desc').get().asFile.path
            task.descriptorSetOptions.includeImports = true
            task.descriptorSetOptions.includeSourceInfo = true
        }
    }
}

loom {
    mods {
        'kizuna_inventory_ui' { sourceSet sourceSets.main }
        'kiui_demo' { sourceSet sourceSets.demo }
        'kiui_wire_smoke' { sourceSet sourceSets.wireSmoke }
    }
    runs {
        demo {
            client()
            source sourceSets.demo
            runDir 'build/demo'
        }
        smoke {
            client()
            source sourceSets.demo
            property 'kiui.smoke', 'true'
            runDir 'build/smoke'
        }
        wireServer {
            server()
            source sourceSets.wireSmoke
            runDir 'build/wire-server'
            programArg 'nogui'
        }
        wireClient {
            client()
            source sourceSets.wireSmoke
            property 'kiui.wireSmoke', 'true'
            property 'kiui.smoke', 'true'
            runDir 'build/wire-client'
        }
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

jar { from('LICENSE') }

tasks.register('demoJar', Jar) {
    archiveClassifier = 'demo-dev'
    from sourceSets.demo.output
}

tasks.register('remapDemoJar', net.fabricmc.loom.task.RemapJarTask) {
    dependsOn tasks.named('demoJar')
    inputFile = tasks.named('demoJar').flatMap { it.archiveFile }
    archiveClassifier = 'demo'
    addNestedDependencies = false
}

build.dependsOn tasks.named('remapDemoJar')

// 服务端可直接取用协议源文件，无需依赖 Minecraft 客户端框架 JAR。
tasks.register('protocolZip', Zip) {
    dependsOn tasks.named('generateProto')
    archiveClassifier = 'proto'
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from('src/main/proto')
    from(layout.buildDirectory.file('descriptors/inventory-ui-v2.desc')) { into 'descriptors' }
    from('LICENSE')
}

build.dependsOn tasks.named('protocolZip')
// 两端产物分别安装；服务端路由不依赖客户端 UI、owo 或渲染类。
build.dependsOn ':server:build'
check.dependsOn ':server:check'
