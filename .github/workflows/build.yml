name: Framework build and routing tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --console=plain test build
      - run: python3 scripts/wiki.py check
      - uses: actions/upload-artifact@v4
        with:
          name: inventory-ui-framework-snapshot
          path: |
            build/libs/*.jar
            server/build/libs/*.jar
            build/distributions/*.zip
