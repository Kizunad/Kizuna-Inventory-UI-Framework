plugins {
    id 'fabric-loom'
    id 'java-library'
    id 'com.google.protobuf'
}

group = rootProject.group
version = rootProject.version
base.archivesName = 'kizuna-inventory-ui-framework-server'

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}
java {
    sourceCompatibility = JavaVersion.toVersion(libs.versions.java.get())
    targetCompatibility = JavaVersion.toVersion(libs.versions.java.get())
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach {
    options.release = libs.versions.java.get().toInteger()
    options.encoding = 'UTF-8'
}
dependencies {
    minecraft libs.minecraft
    mappings loom.officialMojangMappings()
    modImplementation libs.fabric.loader
    modImplementation libs.fabric.api
    api libs.protobuf.java
    include libs.protobuf.java
    testImplementation libs.junit.jupiter
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
// 与客户端从同一份公共 schema 生成；子模块只生成自己的业务消息。
sourceSets.main.proto.srcDir rootProject.file('src/main/proto')
sourceSets.test.proto.srcDir rootProject.file('src/test/proto')
protobuf { protoc { artifact = "com.google.protobuf:protoc:${libs.versions.protobuf.java.get()}" } }
test { useJUnitPlatform() }
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
jar { from rootProject.file('LICENSE') }
